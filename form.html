<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to the ALT School Africa portal."
    />
    <title>Sign In | ALT School Africa</title>
  </head>
  <body>
    <a href="#main-content">Skip to main content</a>

    <header>
      <nav aria-label="Global navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="form.html" aria-current="page">Form</a></li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <h1>Welcome back</h1>
      <p>Sign in to continue to your ALT School Africa portal.</p>

      <form action="#" method="post">
        <fieldset>
          <legend>Sign in details</legend>

          <p>
            <label for="email">Email address</label><br />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </p>

          <p>
            <label for="password">Password</label><br />
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              minlength="8"
              required
            />
          </p>

          <p>
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember">Remember me</label>
          </p>
          <p>
            <a href="https://portal.altschoolafrica.com/auth/forgot-password"
              >Forgot password?</a
            >
          </p>

          <p><button type="submit">Sign in</button></p>
        </fieldset>
      </form>
      <p>
        Don't have an account?
        <a href="https://portal.altschoolafrica.com/auth/signup">Sign up</a>
      </p>
    </main>

    <footer>
      <address>
        MORRISON<br />
        17 Godwin lane, Port harcourt<br />
        Nigeria
      </address>
      <p><small>&copy; 2026 Morrison. All rights reserved.</small></p>
    </footer>
  </body>
</html>
